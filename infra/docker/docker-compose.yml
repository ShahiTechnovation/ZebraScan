# Local stack. Default profile = DEMO backend (no chain, simulated, labelled DEMO everywhere).
#   docker compose -f infra/docker/docker-compose.yml up --build
# Secrets come from infra/docker/.env (copy from .env.example; NEVER commit it).
name: zeb-scan
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: zebscan
      POSTGRES_USER: zebscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U zebscan"], interval: 5s, retries: 20 }

  migrate:
    build: { context: ../.., dockerfile: infra/docker/node.Dockerfile, args: { APP: api } }
    command: ["node", "dist/migrate.js"]
    env_file: .env
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: ../.., dockerfile: infra/docker/node.Dockerfile, args: { APP: api } }
    env_file: .env
    environment: { API_HOST: 0.0.0.0, API_PORT: "4000" }
    ports: ["4000:4000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s }

  worker:
    build: { context: ../.., dockerfile: infra/docker/node.Dockerfile, args: { APP: worker } }
    env_file: .env
    environment: { WORKER_HEALTH_PORT: "4001", WORKER_HEALTH_HOST: 0.0.0.0 }
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args: { NEXT_PUBLIC_ZEB_MODE: connected, NEXT_PUBLIC_API_BASE_URL: "http://localhost:4000" }
    ports: ["3000:3000"]
    depends_on: [api]

  # Testnet only, once services/zcash-gateway passes its checklist:
  #   docker compose --profile testnet up
  zcash-gateway:
    profiles: ["testnet"]
    build: { context: ../.., dockerfile: infra/docker/zcash-gateway.Dockerfile }
    env_file: .env.gateway
    volumes: [gwdata:/data, ./secrets/gateway:/secrets:ro]

volumes:
  pgdata: {}
  gwdata: {}
